name: Refresh live profile cards

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/**", ".github/workflows/refresh-profile.yml"]

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fontTools
        run: pip install -r tools/requirements.txt

      - name: Fetch stats and render about / cp / activity
        run: python tools/update_live.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/v3 tools/data/live.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh live profile cards"
            git push
          fi
