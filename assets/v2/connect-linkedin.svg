<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="150" height="42" viewBox="0 0 150 42" role="img" aria-labelledby="title"><title id="title">LINKEDIN</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111B30"/><stop offset="1" stop-color="#080D1B"/></linearGradient><linearGradient id="glow"><stop stop-color="#58E3F5"/><stop offset=".52" stop-color="#AC8CFF"/><stop offset="1" stop-color="#EE8BC8"/></linearGradient><radialGradient id="halo"><stop stop-color="#607DE5" stop-opacity=".2"/><stop offset="1" stop-color="#607DE5" stop-opacity="0"/></radialGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,monospace}.pulse{animation:pulse 4s ease-in-out infinite}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 22s linear infinite}.flow{stroke-dasharray:5 16;animation:flow 5s linear infinite}.lift{animation:lift 5s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-84}}@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@media(prefers-reduced-motion:reduce){.pulse,.orbit,.flow,.lift{animation:none}}</style><rect x="1" y="1" width="148" height="40" rx="10" fill="url(#bg)" stroke="#23334E"/><g transform="translate(12 10) scale(.85)" fill="none" stroke="#85B3FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="1" width="17" height="17" rx="3"/><path d="M6 7V14M6 4V5M10 14V7M10 10Q10 6 14 8V14"/></g><text x="84" y="25" text-anchor="middle" font-size="11" font-weight="700" letter-spacing=".8" fill="#F2F6FF">LINKEDIN</text></svg>
