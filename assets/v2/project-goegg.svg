<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="242" viewBox="0 0 480 242" role="img" aria-labelledby="title"><title id="title">GoEgg: an e-graph library with parallel matching, rebuilding and extraction in Go.</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111B30"/><stop offset="1" stop-color="#080D1B"/></linearGradient><linearGradient id="glow"><stop stop-color="#58E3F5"/><stop offset=".52" stop-color="#AC8CFF"/><stop offset="1" stop-color="#EE8BC8"/></linearGradient><radialGradient id="halo"><stop stop-color="#607DE5" stop-opacity=".2"/><stop offset="1" stop-color="#607DE5" stop-opacity="0"/></radialGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,monospace}.pulse{animation:pulse 4s ease-in-out infinite}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 22s linear infinite}.flow{stroke-dasharray:5 16;animation:flow 5s linear infinite}.lift{animation:lift 5s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-84}}@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@media(prefers-reduced-motion:reduce){.pulse,.orbit,.flow,.lift{animation:none}}</style>
