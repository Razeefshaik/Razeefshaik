<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="title desc">
<title id="title">Razeef Shaik — Backend, Distributed Systems and Applied AI</title>
<desc id="desc">An animated network core representing backend systems, distributed search and applied AI.</desc>
<defs>
 <linearGradient id="heroBg" x2="1" y2="1"><stop stop-color="#070B18"/><stop offset=".54" stop-color="#111832"/><stop offset="1" stop-color="#0A1023"/></linearGradient>
 <linearGradient id="heroLine"><stop stop-color="#58E3F5"/><stop offset=".5" stop-color="#AC8CFF"/><stop offset="1" stop-color="#EF9BD3"/></linearGradient>
 <radialGradient id="heroGlow"><stop stop-color="#58E3F5" stop-opacity=".3"/><stop offset="1" stop-color="#58E3F5" stop-opacity="0"/></radialGradient>
 <pattern id="heroGrid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8AABFF" stroke-opacity=".1"/></pattern>
 <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<style>
 text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,monospace}
 .spin{transform-box:fill-box;transform-origin:center;animation:spin 22s linear infinite}
 .spin2{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite reverse}
 .blink{animation:blink 3s ease-in-out infinite}.rise{animation:rise 4s ease-in-out infinite}
 @keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
 @media(prefers-reduced-motion:reduce){.spin,.spin2,.blink,.rise{animation:none}}
</style>
<rect x="1" y="1" width="998" height="328" rx="24" fill="url(#heroBg)" stroke="#263A60"/>
<rect x="570" y="1" width="429" height="328" rx="24" fill="url(#heroGrid)"/>
<circle cx="770" cy="172" r="142" fill="url(#heroGlow)" filter="url(#soft)"/>
<path d="M0 280C174 235 290 340 466 277S746 221 1000 274" fill="none" stroke="#AC8CFF" stroke-opacity=".12"/>
<path d="M0 288C174 243 290 348 466 285S746 229 1000 282" fill="none" stroke="url(#heroLine)" stroke-opacity=".65" stroke-width="1.5" stroke-dasharray="2 12"/>
<text x="54" y="62" class="mono" font-size="12" letter-spacing="2.4" fill="#58E3F5">SOFTWARE ENGINEERING / 2026</text>
<text x="50" y="142" font-size="65" font-weight="800" letter-spacing="-3" fill="#F2F6FF">RAZEEF</text>
<text x="50" y="207" font-size="65" font-weight="800" letter-spacing="-3" fill="#F2F6FF">SHAIK</text>
<text x="54" y="243" font-size="14" letter-spacing="1.3" fill="#B6C5DE">BACKEND  /  DISTRIBUTED SYSTEMS  /  APPLIED AI</text>
<path d="M54 266H498" stroke="#263A60"/>
<text x="54" y="294" class="mono" font-size="12" fill="#A7B7D2">NIT SILCHAR · ELECTRICAL ENGINEERING · CLASS OF 2027</text>
<g transform="translate(770 166)">
 <g class="spin" fill="none" stroke="url(#heroLine)" stroke-width="1.4">
  <ellipse rx="145" ry="43"/><ellipse rx="145" ry="43" transform="rotate(60)"/><ellipse rx="145" ry="43" transform="rotate(120)"/>
 </g>
 <g class="spin2" fill="none" stroke="#58E3F5" stroke-opacity=".38" stroke-width="1.2">
  <circle r="104" stroke-dasharray="2 11"/><circle r="75" stroke-dasharray="3 18"/>
 </g>
 <g class="rise">
  <rect x="-45" y="-45" width="90" height="90" rx="16" fill="#0D1730" stroke="url(#heroLine)" stroke-width="2"/>
  <rect x="-27" y="-27" width="54" height="54" rx="11" fill="#111D3A" stroke="#58E3F5" stroke-opacity=".38"/>
  <path d="M-15 -6L-23 0L-15 6M15 -6L23 0L15 6M5 -18L-5 18" fill="none" stroke="#F2F6FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
 </g>
 <g fill="#0D1730" stroke="#AC8CFF" stroke-width="2">
  <circle cx="-114" cy="-10" r="7"/><circle cx="103" cy="55" r="6"/><circle cx="24" cy="-106" r="6"/><circle cx="52" cy="111" r="7"/>
 </g>
 <circle class="blink" r="124" fill="none" stroke="#58E3F5" stroke-width="1.5" stroke-dasharray="1 22"/>
</g>
<g class="blink" fill="#F2F6FF"><circle cx="600" cy="52" r="1.5"/><circle cx="919" cy="88" r="1.5"/><circle cx="634" cy="275" r="1.3"/><circle cx="945" cy="239" r="1.3"/></g>
</svg>