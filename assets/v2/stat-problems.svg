<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="280" height="155" viewBox="0 0 280 155" role="img" aria-labelledby="title"><title id="title">PROBLEMS SOLVED: 1500+. Across coding platforms.</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111B30"/><stop offset="1" stop-color="#080D1B"/></linearGradient><linearGradient id="glow"><stop stop-color="#58E3F5"/><stop offset=".52" stop-color="#AC8CFF"/><stop offset="1" stop-color="#EE8BC8"/></linearGradient><radialGradient id="halo"><stop stop-color="#607DE5" stop-opacity=".2"/><stop offset="1" stop-color="#607DE5" stop-opacity="0"/></radialGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,monospace}.pulse{animation:pulse 4s ease-in-out infinite}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 22s linear infinite}.flow{stroke-dasharray:5 16;animation:flow 5s linear infinite}.lift{animation:lift 5s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-84}}@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@media(prefers-reduced-motion:reduce){.pulse,.orbit,.flow,.lift{animation:none}}</style><rect x="1" y="1" width="278" height="153" rx="16" fill="url(#bg)" stroke="#23334E"/><circle cx="248" cy="28" r="42" fill="url(#halo)"/><circle class="pulse" cx="253" cy="26" r="4" fill="#B49AFF"/><text x="23" y="30" fill="#B49AFF" font-size="10" font-weight="700" letter-spacing="1.4">PROBLEMS SOLVED</text><text x="21" y="91" fill="#F2F6FF" font-size="47" font-weight="700" letter-spacing="-2">1500+</text><text x="23" y="124" fill="#A7B7D2" font-size="12">Across coding platforms</text><path d="M23 143H255" stroke="#B49AFF" stroke-opacity=".35"/><path class="flow" d="M23 143H255" stroke="#B49AFF" stroke-width="2"/></svg>
