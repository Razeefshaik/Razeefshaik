<title id="title">Code Guardian — ai debugging agent</title>
<desc id="desc">Ingests a repository, localizes defects with RAG and static analysis, and proposes fixes on reviewable Git branches. Humans stay in the loop. Kafka job pipeline · one branch per fix</desc>
