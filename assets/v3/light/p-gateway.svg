<text x="28" y="44" class="f-mono" font-size="11" fill="#E2550A" letter-spacing="1.5">SEARCH INFRASTRUCTURE</text>
<text x="26" y="96" class="f-serif" font-size="40" fill="#17130F" letter-spacing="-0.5">Search Gateway</text>
<text x="28" y="146" class="f-sans" font-size="14.5" fill="#3E362E">Text-to-vector search through Go gRPC APIs,</text>
<text x="28" y="168" class="f-sans" font-size="14.5" fill="#3E362E">idempotent Kafka ingestion, and separate</text>
<text x="28" y="190" class="f-sans" font-size="14.5" fill="#3E362E">embedding services for search and ingest.</text>
