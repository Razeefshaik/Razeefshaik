<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 500 300" width="500" height="300" role="img" aria-labelledby="title desc" fill="none">
<title id="title">Search Gateway — search infrastructure</title>
<desc id="desc">Text-to-vector search through Go gRPC APIs, idempotent Kafka ingestion, and separate embedding services for search and ingest. token-bucket rate limits per client</desc>
