@keyframes leak3{0.00%{transform:translateX(0);opacity:0}20.00%{opacity:1}100.00%{transform:translateX(34px);opacity:0}}.leak3{animation:leak3 2.4s linear infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}.nudge{animation:nudge 2.4s ease-in-out infinite}
